version: "3.9"

services:
  ollama:
    # Pinned: bump deliberately after checking the release notes.
    image: ollama/ollama:0.35.1
    container_name: ollama
    # No published ports: the app reaches Ollama over the internal compose
    # network (http://ollama:11434). Publishing 11434 would expose an
    # unauthenticated Ollama API to your LAN. To use the Ollama CLI, run
    # `docker compose exec ollama ollama ...` instead.
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    container_name: meeting-notes-app
    ports:
      # Bind to loopback only. "8000:8000" would listen on every interface
      # and expose all meeting data to anyone on your network.
      - "127.0.0.1:8000:8000"
    environment:
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_URL=http://ollama:11434/api/generate
      - WHISPER_MODEL_SIZE=base
      # Set API_TOKEN in a .env file next to this compose file. If empty, a
      # temporary token is generated on each start (see `docker compose logs app`).
      - API_TOKEN=${API_TOKEN:-}
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: